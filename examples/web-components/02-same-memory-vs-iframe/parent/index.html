<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>같은 메모리(웹 컴포넌트) vs iframe</title>
<style>
  body { font-family: sans-serif; padding: 40px; max-width: 700px; line-height: 1.6; }
  .log { white-space: pre-wrap; background: #eee; padding: 12px; margin-top: 8px; border-radius: 6px; font-family: monospace; }
  iframe { width: 100%; height: 80px; border: 1px solid #ccc; margin-top: 8px; }
</style>
</head>
<body>
<h1>부모 메모리에 있는 함수를 자식에게 넘길 수 있나?</h1>
<p>부모 페이지에만 있는 "인증된 API 호출 함수"(axios 인스턴스 흉내)를 두 자식에게 넘겨봅니다.</p>

<h2>1) 웹 컴포넌트 (같은 window, 같은 origin)</h2>
<api-caller></api-caller>
<div class="log" id="log1">버튼을 눌러보세요</div>

<h2>2) iframe (다른 포트 = 다른 origin)</h2>
<iframe src="http://localhost:5502" id="frame"></iframe>
<div class="log" id="log2">로딩 중...</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script>
  // 부모 메모리에만 살아있는 함수. 이 함수 자체가 넘어가야 "성공".
  function fakeAuthedApi(path) {
    return `✅ [인증됨] GET ${path} → 200 OK (부모가 가진 토큰으로 실제 호출됨)`;
  }

  const ApiCaller = Vue.defineCustomElement({
    props: ['apiFn'],
    template: `<button @click="call">이 컴포넌트로 API 호출해보기</button>`,
    methods: {
      call() {
        const el = document.getElementById('log1');
        el.textContent = (typeof this.apiFn === 'function')
          ? this.apiFn('/api/orders')
          : `❌ 실패: apiFn이 함수가 아니라 "${typeof this.apiFn}"입니다`;
      }
    }
  });
  customElements.define('api-caller', ApiCaller);
  // 살아있는 함수를 "참조 그대로" 프로퍼티로 꽂는다 — 이게 웹 컴포넌트라 가능한 것
  document.querySelector('api-caller').apiFn = fakeAuthedApi;

  const frame = document.getElementById('frame');
  frame.addEventListener('load', () => {
    const el = document.getElementById('log2');
    let msg = '';
    try {
      // cross-origin iframe의 window에 직접 함수를 꽂아본다 → 브라우저가 막아야 정상
      frame.contentWindow.apiFn = fakeAuthedApi;
      msg = '뜻밖에 성공? (같은 origin이면 가능 — 포트가 다른지 확인하세요)';
    } catch (e) {
      msg = `❌ 직접 대입 실패: ${e.name} — ${e.message}\n(cross-origin이라 함수를 못 심음)`;
    }

    try {
      // postMessage는 "직렬화 가능한 데이터"만 통과시킨다 — 함수는 복제 불가
      frame.contentWindow.postMessage({ type: 'authedApi', fn: fakeAuthedApi }, '*');
    } catch (e) {
      msg += `\n\npostMessage로 함수 전달 시도: ❌ ${e.name} — ${e.message}`;
    }
    el.textContent = msg;
  });
</script>
</body>
</html>
